version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: raftaar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-raftaar_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-raftaar_secret_pw}
      POSTGRES_DB: ${DB_NAME:-raftaar_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-raftaar_admin} -d ${DB_NAME:-raftaar_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: raftaar_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
